namespace: wanderlust

backend:
  replicaCount: 2

  image:
    repository: xerox2/wanderlust-backend
    tag: "11"
    pullPolicy: Always

  containerPort: 5000

  configMapName: backend-config
  secretName: backend-secret

  service:
    type: ClusterIP
    port: 5000

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  livenessProbe:
    path: /
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  config:
    nodeEnv: production
    port: "5000"

    frontendUrl: http://frontend-service

    mongoHost: mongodb-service
    mongoPort: "27017"

    redisHost: redis-service
    redisPort: "6379"

    databaseName: wanderlust

  secret:
    jwtSecret: change-this-to-a-secure-secret
    mongodbUri: mongodb://mongodb-service:27017/wanderlust
    redisUrl: redis://redis-service:6379
    googleClientId: your-google-client-id
    googleClientSecret: your-google-client-secret

frontend:
  replicaCount: 2

  image:
    repository: xerox2/wanderlust-frontend
    tag: "11"
    pullPolicy: Always

  containerPort: 80
  
  service:
    type: ClusterIP
    port: 80

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

  livenessProbe:
    path: /
    initialDelaySeconds: 20
    periodSeconds: 10

  readinessProbe:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 5

mongodb:
  replicaCount: 1

  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent

  containerPort: 27017

  database: wanderlust

  service:
    name: mongodb-service
    port: 27017
    clusterIP: None

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
redis:
  replicaCount: 1

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  containerPort: 6379

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

ingress:
  enabled: true
  className: nginx

  host: wanderlust.local
  path: /
  pathType: Prefix

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""