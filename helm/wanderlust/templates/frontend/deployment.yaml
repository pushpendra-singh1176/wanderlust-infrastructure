apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: wanderlust

  labels:
    app: "{{ .Release.Name }}-frontend"
    tier: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: "{{ .Release.Name }}-frontend"

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: "{{ .Release.Name }}-frontend"
        tier: frontend

    spec:
      containers:
        - name: "{{ .Release.Name }}-frontend"

          image: xerox2/wanderlust-frontend:9

          imagePullPolicy: Always

          ports:
            - containerPort: {{ .Values.frontend.containerPort }}
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 20
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 5