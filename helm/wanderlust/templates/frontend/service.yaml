apiVersion: v1
kind: Service

metadata:
  name: {{ .Release.Name }}-frontend
  namespace: {{ .Release.Namespace }}

  labels:
    app: {{ .Release.Name }}-frontend
    tier: frontend

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    app: {{ .Release.Name }}-frontend

  ports:
    - protocol: TCP
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}